<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Assistant SaaS</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">PDF Assistant</a>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow p-4 mb-5 bg-white rounded">
      <h2 class="mb-4">Upload your PDF</h2>
      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <input class="form-control" type="file" name="pdf_file" accept="application/pdf" required>
        </div>
        <button class="btn btn-primary" type="submit">Summarize</button>
      </form>
    </div>

    {% if summary %}
      <div class="card shadow p-4 mb-4 bg-white rounded">
        <h3>Summary</h3>
        <p>{{ summary|safe }}</p>
      </div>

      <div class="card shadow p-4 mb-5 bg-white rounded">
        <h3>Ask a Question</h3>
        <form method="POST">
          <input type="hidden" name="question_mode" value="yes">
          <div class="mb-3">
            <input class="form-control" type="text" name="user_question" placeholder="Enter your question" required>
          </div>
          <button class="btn btn-success" type="submit">Get Answer</button>
        </form>
      </div>
    {% endif %}

    {% if answer %}
      <div class="card shadow p-4 mb-5 bg-white rounded">
        <h3>Answer</h3>
        <p>{{ answer|safe }}</p>
      </div>
    {% endif %}
  </div>

  <footer class="text-center mt-5 mb-3 text-muted">
    &copy; 2025 PDF Assistant SaaS
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
